<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chinmay Padsala - Documentation</title>
<script>(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f8;--card:#ffffff;--text:#18181b;--muted:#6b6b76;--border:#e4e4e8;
  --accent:#3b4cca;--chip:#f0f0f3;--chip-text:#3f3f46;
  --r:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
:root[data-theme="dark"]{
  --bg:#111114;--card:#1b1b20;--text:#f2f2f5;--muted:#9a9aa6;--border:#2c2c33;
  --accent:#8b97ff;--chip:#26262d;--chip-text:#d4d4dc;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--border)}
.bar-in{max-width:760px;margin:0 auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.back{color:var(--muted);font-weight:500;font-size:.92rem;text-decoration:none}
.back:hover{color:var(--text)}
.toggle{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.toggle:hover{border-color:var(--accent)}
.toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toggle .sun{display:none}
:root[data-theme="dark"] .toggle .sun{display:block}
:root[data-theme="dark"] .toggle .moon{display:none}
header{max-width:760px;margin:0 auto;padding:56px 24px 8px}
.course{display:inline-block;background:var(--chip);color:var(--chip-text);font-size:.85rem;font-weight:600;padding:5px 12px;border-radius:999px;margin-bottom:16px}
h1{font-size:clamp(2rem,5vw,2.7rem);line-height:1.1;letter-spacing:-.025em;margin:0;font-weight:700}
.lede{color:var(--muted);margin:10px 0 0}
main{max-width:760px;margin:0 auto;padding:36px 24px 72px;display:flex;flex-direction:column;gap:24px}
.entry{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
.date{color:var(--accent);font-size:.85rem;font-weight:600;margin:0 0 4px}
.entry h2{font-size:1.3rem;letter-spacing:-.01em;margin:0 0 10px;font-weight:600}
.entry p{margin:0 0 10px;max-width:68ch}
figure{margin:18px 0 0}
figure img{max-width:100%;display:block;border:1px solid var(--border);border-radius:8px}
figcaption{font-size:.85rem;color:var(--muted);margin-top:8px}
footer{border-top:1px solid var(--border);background:var(--card)}
footer div{max-width:760px;margin:0 auto;padding:24px;color:var(--muted);font-size:.88rem}
.profile{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 26px}
.profile h2{font-size:1.05rem;margin:18px 0 6px;font-weight:600}
.profile dl{margin:0}
.profile .f{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--border);font-size:.93rem}
.profile .f:has(dd:empty){display:none}
.profile dt{color:var(--muted)}.profile dd{margin:0;font-weight:500}
@media(max-width:620px){.profile{padding:6px 22px}.profile .f{grid-template-columns:1fr;gap:2px}}
@media(max-width:620px){header{padding-top:36px}.entry{padding:22px}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <a class="back" href="index.html">&larr; Back to team page</a>
  <button class="toggle" id="themeBtn" type="button" aria-label="Switch to night mode">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div></div>

<header>
  <span class="course">IT Capstone 8000</span>
  <h1>Chinmay Padsala</h1>
  <p class="lede">Documentation</p>
</header>

<main>
  <!--
    PROFILE: index.html reads these rows to build the team card.
    Edit the text between <dd> and </dd>. Leave a row empty to hide it.
    Write skills separated by commas.
  -->
  <section class="profile" aria-label="Profile">
    <h2>Profile</h2>
    <dl>
      <div class="f" data-field="nationality"><dt>Nationality</dt><dd>Indian</dd></div>
      <div class="f" data-field="education"><dt>Education</dt><dd>Computer Science &amp; Engineering</dd></div>
      <div class="f" data-field="skills"><dt>IT skills</dt><dd>Database Management</dd></div>
      <div class="f" data-field="work"><dt>Work experience</dt><dd></dd></div>
      <div class="f" data-field="goal"><dt>Project goal</dt><dd></dd></div>
      <div class="f" data-field="hobby"><dt>Hobby</dt><dd>Travelling</dd></div>
    </dl>
  </section>
  <!-- Copy this whole <article> block for each new entry -->
  <article class="entry">
    <p class="date">Week 2</p>
    <h2>Entry Title</h2>
    <p>Write your documentation here.</p>
    <!-- Delete this figure if the entry has no image. It also hides itself if the image file is missing. -->
    <figure>
      <img src="images/your-image.png" alt="Image description" onerror="this.closest('figure').hidden=true">
      <figcaption>Image caption</figcaption>
    </figure>
  </article>
</main>

<footer><div>IT Capstone 8000</div></footer>

<script>
const btn=document.getElementById("themeBtn");
function syncBtn(){btn.setAttribute("aria-label",document.documentElement.dataset.theme==="dark"?"Switch to day mode":"Switch to night mode")}
syncBtn();
btn.addEventListener("click",()=>{
  const t=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem("theme",t)}catch(e){}
  syncBtn();
});

/* Sends this page's profile to index.html when index.html loads it. Keep this block. */
if(window.parent!==window){
  const g=k=>{const e=document.querySelector('[data-field="'+k+'"] dd');return e?e.textContent.trim():""};
  parent.postMessage({type:"profile",name:document.querySelector("h1").textContent.trim(),nat:g("nationality"),edu:g("education"),skills:g("skills"),work:g("work"),goal:g("goal"),hobby:g("hobby"),entries:document.querySelectorAll(".entry").length},"*");
}
</script>
</body>
</html>
