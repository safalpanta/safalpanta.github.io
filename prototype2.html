<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroClass — Student Telemetry & Community Prototype</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
    }

    /* Smooth transitions for device frame switching */
    #device-wrapper {
      transition: max-width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  border-radius 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  border-width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Mobile frame styling when active */
    .mode-mobile {
      max-width: 390px !important;
      border-radius: 42px;
      border: 10px solid #1e293b;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background-color: #f8fafc;
      overflow: hidden;
    }

    /* Laptop frame styling when active */
    .mode-laptop {
      max-width: 1200px !important;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      background-color: #f8fafc;
      overflow: hidden;
    }

    /* Custom subtle scrollbar for chat */
    .chat-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .chat-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    /* Bar height transition */
    .altitude-bar {
      transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease, opacity 0.3s ease;
    }

    /* Blur effect for hidden telemetry */
    .telemetry-blurred {
      filter: blur(5px);
      user-select: none;
      opacity: 0.45;
      transition: all 0.25s ease;
    }
    .telemetry-visible {
      filter: blur(0);
      opacity: 1;
      transition: all 0.25s ease;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-12 selection:bg-indigo-100 selection:text-indigo-700">

  <!-- ========================================================= -->
  <!-- 1. TOP UTILITY HEADER: MOBILE & LAPTOP VIEWPORT TOGGLE    -->
  <!-- ========================================================= -->
  <header class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-800 px-4 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <!-- Prototype Branding -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center font-bold text-white shadow-inner">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-8M14 7h7v7" />
          </svg>
        </div>
        <div>
          <span class="font-semibold text-sm tracking-tight text-white">AeroClass Prototype</span>
          <span class="hidden sm:inline-block ml-2 text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full">Interactive UI Preview</span>
        </div>
      </div>

      <!-- Mobile / Laptop Switcher Pill -->
      <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700/80" role="group" aria-label="Viewport mode toggle">
        <button
          id="btn-mobile"
          type="button"
          onclick="setViewportMode('mobile')"
          class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200 text-slate-300 hover:text-white"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="7" y="2" width="10" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          Mobile
        </button>
        <button
          id="btn-laptop"
          type="button"
          onclick="setViewportMode('laptop')"
          class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200 bg-indigo-600 text-white shadow-sm"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="12" rx="2" ry="2"></rect>
            <line x1="2" y1="20" x2="22" y2="20"></line>
          </svg>
          Laptop
        </button>
      </div>

      <!-- Status Indicator -->
      <div class="hidden md:flex items-center gap-2 text-xs text-slate-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Viewport: <strong id="viewport-label" class="text-slate-200 font-medium">Laptop (1200px)</strong></span>
      </div>
    </div>
  </header>

  <!-- ========================================================= -->
  <!-- MAIN DEVICE CONTAINER (ADAPTS BETWEEN MOBILE & LAPTOP)    -->
  <!-- ========================================================= -->
  <main class="px-3 sm:px-6 pt-6">
    <div id="device-wrapper" class="mode-laptop mx-auto transition-all">

      <!-- Simulated Mobile Notch Bar (Only visible in Mobile Mode) -->
      <div id="mobile-notch" class="hidden bg-slate-900 text-white px-6 pt-2 pb-2.5 flex items-center justify-between text-[11px] font-medium">
        <span>9:41</span>
        <div class="w-20 h-4 bg-black rounded-full"></div>
        <div class="flex items-center gap-1.5">
          <span>5G</span>
          <div class="w-4 h-2.5 border border-white/70 rounded-sm p-0.5">
            <div class="w-full h-full bg-emerald-400 rounded-[1px]"></div>
          </div>
        </div>
      </div>

      <!-- Inner Dashboard Content -->
      <div id="dashboard-inner" class="p-5 sm:p-7 space-y-6">

        <!-- ===================================================== -->
        <!-- 2. TOP STUDENT GREETING                               -->
        <!-- ===================================================== -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200/80 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4" id="greeting-card">
          <div class="flex items-center gap-4
